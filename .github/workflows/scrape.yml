name: Daily Scrape

on:
  schedule:
    # Run at 04:00 UTC every day (Monday through Sunday)
    - cron: '0 4 * * *'
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - name: Install Python dependencies
        run: pip install pdfplumber requests

      - name: Run Scraper
        env:
          TZ: "Europe/Berlin"
        run: npm run scrape

      - name: Copy menu data to docs
        run: cp public/data/menus.json docs/data/menus.json

      - name: Commit and Push Menu Data
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add public/data/menus.json docs/data/menus.json
          # Only commit if there are changes
          git diff --staged --quiet || (git commit -m "chore: update menu data [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
